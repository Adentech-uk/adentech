name: AdenTech website checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  website:
    name: Website syntax and contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run website regression tests
        run: npm test
      - name: Check responsive layout at phone, tablet and desktop widths
        run: npm run check:responsive
