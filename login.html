<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in or create an account | AdenTech</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/account.css"></head>
<body><main class="panel"><a class="brand" href="index.html">AdenTech</a><h1>Your AdenTech account</h1><p>Sign in to view your requests, or create an account to keep track of future enquiries.</p>
<div class="tabs"><button id="show-login" class="active" type="button">Sign in</button><button id="show-signup" type="button">Create account</button></div>
<form id="auth-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="12" required><button id="submit" class="primary" type="submit">Sign in</button></form>
<button id="reset" class="link" type="button">Forgot password?</button><p id="message" class="message" role="status" aria-live="polite"></p><p class="fine">Use a unique password. AdenTech will never ask you to email a password or one-time security code.</p><a href="index.html">Back to AdenTech</a></main>
<script src="auth-config.js"></script><script type="module" src="assets/account-auth.js"></script></body></html>
